# Serves the SPA and reverse-proxies the gateway. Same-origin: the browser hits only this server,
# so no CORS and the SPA's /api,/ws,/health,/feedback,/inbound calls just work in production.
upstream gateway {
    server gateway:8787;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket chat + presence — needs the Upgrade dance.
    location /ws {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # REST reads + actions + webhooks → the gateway.
    location ~ ^/(api|health|feedback|inbound)(/|$) {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else is the SPA (client-side routing → index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
