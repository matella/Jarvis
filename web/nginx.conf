# Serves the SPA and reverse-proxies the gateway. Same-origin: the browser hits only this server,
# so no CORS and the SPA's /api,/ws,/health,/feedback,/inbound calls just work in production.
#
# We use Docker's embedded DNS (127.0.0.11) + a variable upstream so nginx RE-RESOLVES `gateway`
# per request. Without this, nginx caches the gateway's IP at startup and breaks whenever the
# gateway container is recreated (new IP).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket chat + presence — needs the Upgrade dance.
    location /ws {
        set $gw gateway;
        proxy_pass http://$gw:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # REST reads + actions + webhooks → the gateway.
    location ~ ^/(api|health|feedback|inbound)(/|$) {
        set $gw gateway;
        proxy_pass http://$gw:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else is the SPA (client-side routing → index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
