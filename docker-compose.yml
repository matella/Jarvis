# M0 infra spine — Postgres+pgvector and Redis Streams, nothing else.
# Runs on the REMOTE homelab daemon via an SSH docker context:
#   docker --context jarvis compose up -d   (see Makefile / README)
#
# Ports bind the REMOTE loopback only (BIND_HOST=127.0.0.1) so nothing is
# exposed on the LAN; reach them from the Mac through an SSH tunnel, then
# `python scripts/healthcheck.py` (connects to 127.0.0.1) must exit 0.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    # appendonly so the event stream survives a restart; Streams live in the AOF.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 9 — local-first web search. Internal to the compose network: the gateway/daemon reach
  # it by service name (SEARXNG_URL=http://searxng:8080), so it needs no host port (avoids LAN
  # exposure and port clashes with other homelab apps). After first start, enable JSON in the
  # generated /etc/searxng/settings.yml (search.formats: [html, json]) so the SearchProvider works.
  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - searxng-config:/etc/searxng
    profiles: ["search"]  # opt-in: `docker --context jarvis compose --profile search up -d`

  # Conversational gateway (FastAPI + /ws). Internal to the compose network — the console
  # reverse-proxies it, so it needs no published host port. Reaches deps by service name; Ollama
  # runs on the host. Migrations apply on startup. Set GATEWAY_TOKEN to require auth.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis-gateway:latest
    container_name: jarvis-gateway
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      REDIS_HOST: redis
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: "11434"
      MODEL_REASONING: ${MODEL_REASONING:-qwen3:1.7b}   # light tenant on the shared 8 GB GPU
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      JARVIS_MODE: ${JARVIS_MODE:-observe}
      # Local-first web search (weather, lookups). Reaches SearXNG by service name; the host
      # must be egress-allowlisted (default-deny). Unset SEARXNG_URL to turn search off again.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-searxng}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # let the container reach Ollama on the host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  # The spine daemon (`jarvis run`) — ingest + projector + reactor + verify + anomaly + routines +
  # snapshot/selfcheck/etc. Same image as the gateway; uses the host's Docker via a mounted socket
  # (DOCKER_CONTEXT=default) for ingest/metrics/topology. The socket is root-equivalent on the host
  # — that's inherent to an agent that operates the homelab; keep it on your trusted box only.
  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis-gateway:latest
    container_name: jarvis-daemon
    restart: unless-stopped
    command: ["jarvis", "run"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      REDIS_HOST: redis
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: "11434"
      MODEL_REASONING: ${MODEL_REASONING:-qwen3:1.7b}   # light tenant on the shared 8 GB GPU
      JARVIS_MODE: ${JARVIS_MODE:-observe}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}   # routines/RAG may search too
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-searxng}
      DOCKER_CONTEXT: default   # use the mounted socket, not the Mac's SSH 'jarvis' context
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # ingest/metrics/topology drive host Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  # The interface — nginx serving the React SPA + reverse-proxying the gateway. Published on the
  # LAN like the other homelab apps; put it behind nginx-proxy-manager / VPN as usual.
  console:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: jarvis-console:latest
    container_name: jarvis-console
    restart: unless-stopped
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-8092}:80"
    depends_on:
      - gateway
    profiles: ["app"]

volumes:
  postgres-data:
  redis-data:
  searxng-config:
