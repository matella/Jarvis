[project]
name = "jarvis"
version = "0.0.0"
description = "AI-native operational intelligence for a homelab — event-driven cognition over infrastructure state."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pgvector>=0.3",
    "python-ulid>=2.2",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.0",
    "ollama>=0.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
# Local, on-device speech (CPU). Installed in the gateway image; audio never leaves the box.
# faster-whisper bundles CTranslate2 + PyAV (decodes the browser's webm directly); piper-tts is the
# local TTS engine (the default `tts_backend`).
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
]

[project.scripts]
jarvis = "jarvis.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in defaults (B008 is a false
# positive here); the gateway is the only place this pattern appears.
"jarvis/gateway/app.py" = ["B008"]
"jarvis/gateway/modules_api.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres+pgvector / Redis (DB reachable via the SSH tunnel)",
]
